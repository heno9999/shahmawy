<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shahmawy | نظام شهم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
              tech: ['Orbitron', 'sans-serif'],
            },
            colors: {
              shahm: {
                bg: '#020408',
                surface: '#0a1018', // Slightly lighter for panels
                border: '#1e293b',
                primary: '#00ff9d', // Phosphorescent Green
                secondary: '#00f3ff', // Neon Cyan
                alert: '#ff0055', // Neon Red
                purple: '#bc13fe', // Neon Purple
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'scanline': 'scanline 8s linear infinite',
              'spin-slow': 'spin 12s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                'from': { boxShadow: '0 0 5px #00ff9d, 0 0 10px #00ff9d' },
                'to': { boxShadow: '0 0 20px #00ff9d, 0 0 30px #00ff9d' },
              },
              scanline: {
                '0%': { top: '-100%' },
                '100%': { top: '100%' }
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #020408;
        color: #e2e8f0;
        overflow: hidden;
      }

      /* Moving Cyber Grid */
      .cyber-grid {
        background-image: 
          linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        perspective: 1000px;
        transform-style: preserve-3d;
        animation: grid-move 20s linear infinite;
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      @keyframes grid-move {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }

      /* Phosphorescent Glows */
      .text-glow {
        text-shadow: 0 0 10px rgba(0, 255, 157, 0.5);
      }
      
      .box-glow {
        box-shadow: 0 0 15px rgba(0, 255, 157, 0.1);
      }

      .box-glow-hover:hover {
        box-shadow: 0 0 25px rgba(0, 255, 157, 0.3);
      }

      /* Glassmorphism */
      .glass-panel {
        background: rgba(10, 20, 30, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 255, 157, 0.1);
      }

      /* Scrollbar */
      .custom-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: #020408; 
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #00ff9d; 
        border-radius: 2px;
      }
      
      /* Tech Decorations */
      .tech-corner {
        position: absolute;
        width: 8px;
        height: 8px;
        border-color: #00ff9d;
        border-style: solid;
        transition: all 0.3s ease;
      }
      .tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
      .tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
      .bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
      .br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

      .group:hover .tech-corner {
        width: 100%;
        height: 100%;
        opacity: 0.5;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "recharts": "https://esm.sh/recharts@2.15.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
